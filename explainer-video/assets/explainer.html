<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>explainer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<!--
  explainer-video page · 1920×1080 · pastel glass house style.
  Do not edit this file beyond <title> and the component CSS block marked "add your own".
  Write the video in shots.js (see shots.example.js). Background, HUD, captions, timeline,
  transitions, sound cues and layout lint come from explainer.js.
  Safe content area: x 80–1840, y 180–900 (above: HUD, below: caption).
-->
<style>
  :root{
    --ink:#1E2240; --ink2:#5D6385; --ink3:#9095B0; --line:#E2E5F2; --card:rgba(255,255,255,.88);
    --blue:#3B6CF6; --purple:#7C4DFF; --pink:#E6458B; --green:#14B27A; --orange:#F59E0B; --cyan:#0EA5C6; --red:#EF4444; --indigo:#4F46E5;
    --sans:'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --mono:'JetBrains Mono', 'SF Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;font-family:var(--sans);color:var(--ink);
    background:linear-gradient(135deg,#EEE9FF 0%,#E5EFFF 38%,#E7F7F1 70%,#FFF0E5 100%)}
  #bg{position:absolute;inset:0;overflow:hidden}
  #bg .blob{position:absolute;width:1300px;height:1300px;border-radius:50%;opacity:.55;background:radial-gradient(circle,var(--b) 0%,transparent 68%)}
  #bg .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(70,80,140,.14) 1.6px,transparent 1.8px);background-size:34px 34px}
  #world{position:absolute;inset:0}
  .shot{position:absolute;inset:0;transform-origin:50% 50%}
  .abs{position:absolute}
  .mono{font-family:var(--mono)}
  .center{display:flex;align-items:center;justify-content:center}

  /* ---------- component kit ---------- */
  .card{background:var(--card);border:2px solid rgba(255,255,255,.95);border-radius:28px;
    box-shadow:0 24px 70px rgba(60,70,150,.13),0 2px 6px rgba(60,70,150,.06)}
  .card.ring{box-shadow:0 0 0 3px var(--c,var(--blue)),0 24px 70px rgba(60,70,150,.16)}
  .pill{background:rgba(255,255,255,.92);border-radius:999px;box-shadow:0 10px 30px rgba(60,70,150,.10)}
  .tag{display:inline-flex;align-items:center;padding:8px 24px;border-radius:999px;font-weight:700;font-size:26px;
    color:var(--c,var(--blue));background:color-mix(in srgb,var(--c,var(--blue)) 12%,white)}
  .tok{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px;border:3px solid var(--c,var(--blue));
    color:var(--c,var(--blue));background:color-mix(in srgb,var(--c,var(--blue)) 9%,white);border-radius:16px;font-weight:900;font-size:46px;line-height:1.1}
  .tok .id{font:600 20px var(--mono);color:var(--ink2);margin-top:6px}
  .node{display:flex;flex-direction:column;align-items:center;gap:14px;font-size:28px;font-weight:700;color:var(--ink2)}
  .node .ic{width:132px;height:132px;border-radius:36px;background:#fff;display:grid;place-items:center;
    box-shadow:0 12px 34px rgba(60,70,150,.14);border:3px solid color-mix(in srgb,var(--c,var(--blue)) 30%,white);color:var(--c,var(--blue))}
  .node .ic svg{width:68px;height:68px}
  .bar{height:28px;border-radius:14px;background:var(--c,var(--blue))}
  .t-hero{font-weight:900;font-size:128px;line-height:1.05;letter-spacing:-.01em}
  .t-h2{font-weight:900;font-size:60px;line-height:1.15}
  .t-h3{font-weight:700;font-size:40px;line-height:1.25}
  .t-body{font-size:30px;line-height:1.5;color:var(--ink2)}
  .t-label{font-size:24px;font-weight:500;color:var(--ink2)}
  .code{font:500 30px/1.6 var(--mono);color:var(--ink)}
  .grad-text{background:linear-gradient(90deg,var(--blue),var(--purple) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  /* splitChars/riseChars wrap each glyph in an inline-block span, which escapes the parent's text clip: give each glyph the clip itself */
  .grad-text .ch{background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent}
  svg.wire{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
  svg.wire path{fill:none;stroke-width:4;stroke-linecap:round}
  /* ---------- add your own component CSS below ---------- */

  /* ---------- HUD + caption (owned by explainer.js) ---------- */
  #hud{position:absolute;inset:0;z-index:40;pointer-events:none}
  #hud-chip{position:absolute;left:52px;top:34px;height:68px;padding:0 32px 0 12px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:30px}
  #hud-num{width:46px;height:46px;border-radius:50%;color:#fff;font:700 20px var(--mono);display:grid;place-items:center}
  #hud-meter{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:600px;display:flex;flex-direction:column;align-items:center}
  #hud-clock{height:82px;padding:0 42px;display:flex;align-items:center;gap:20px}
  #hud-clock .lbl,#hud-rate .lbl{font-size:24px;color:var(--ink2)}
  #hud-val{font-weight:600;font-size:52px;min-width:190px;text-align:right;color:var(--ink)}
  #hud-clock .unit{font-size:26px;color:var(--ink2)}
  #hud-scrub{position:relative;width:560px;height:30px;margin-top:20px}
  #hud-track{position:absolute;left:0;right:0;top:0;height:6px;border-radius:3px;background:rgba(80,90,140,.14)}
  .seg{position:absolute;top:0;height:6px;border-radius:3px}
  #hud-knob{position:absolute;top:-7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;border:4px solid var(--blue)}
  .tick{position:absolute;top:14px;transform:translateX(-50%);font-size:16px;color:var(--ink3)}
  #hud-rate{position:absolute;right:52px;top:34px;height:68px;padding:0 32px;display:flex;align-items:center;gap:14px}
  #hud-rate b{font-size:36px;font-weight:900}
  #cap{position:absolute;left:0;right:0;bottom:0;z-index:45;pointer-events:none}
  #cap-pill{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);padding:20px 50px;font-weight:700;font-size:40px;white-space:nowrap;color:var(--ink)}
  #cap-pill em{font-style:normal;margin:0 .12em}
</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <div class="blob" style="left:-300px;top:-400px;--b:#C9B8FF"></div>
    <div class="blob" style="left:1100px;top:-300px;--b:#B8D4FF"></div>
    <div class="blob" style="left:-200px;top:500px;--b:#B9EEDB"></div>
    <div class="blob" style="left:1200px;top:520px;--b:#FFD7BD"></div>
    <div class="grid"></div>
  </div>
  <div id="world"></div>
  <div id="hud"></div>
  <div id="cap"></div>
</div>
<script src="engine.js"></script>
<script src="explainer.js"></script>
<script src="icons.js"></script>
<script src="shots.js"></script>
</body>
</html>
