<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>信息茧房 · 封面 3:4</title>
<link rel="stylesheet" href="fonts/fonts.css">
<!-- Cover 1080×1440 (Xiaohongshu card): the film's own frame at the cocoon (≈38.5 s: four colours left, the cocoon
     formed) + the title, sized to stay readable when the card is ~500 px wide. Render: render.mjs --stills 0.5 -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;width:1080px;height:1440px;overflow:hidden;transform-origin:0 0;background:#060607;color:#E9EBEF;font-family:'Noto Sans SC',sans-serif}
  #root{position:absolute;inset:0} #cv{position:absolute;inset:0;width:1080px;height:1440px}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 58%,transparent 50%,rgba(0,0,0,.55) 100%)}
  #top{position:absolute;left:0;right:0;top:0;height:560px;background:linear-gradient(#060607 0%,rgba(6,6,7,.9) 55%,rgba(6,6,7,0) 100%)}
  .t1{position:absolute;left:0;width:1080px;top:96px;text-align:center;font:900 176px/1 'Noto Sans SC';letter-spacing:.12em;text-shadow:0 0 40px #000}
  .t2{position:absolute;left:0;width:1080px;top:300px;text-align:center;font:900 112px/1 'Noto Sans SC';letter-spacing:.08em;color:#E9EBEF;text-shadow:0 0 30px #000}
  .t3{position:absolute;left:0;width:1080px;bottom:70px;text-align:center;font:500 40px/1.3 'Noto Sans SC';letter-spacing:.1em;color:#C9CCD2;text-shadow:0 0 20px #000}
  .t3 em{font-style:normal;color:#8FE3C4}
</style>
</head>
<body>
<div id="stage"><div id="root">
  <canvas id="cv" width="1080" height="1440"></canvas><div id="vig"></div><div id="top"></div>
  <div class="t1">蚕吐丝</div>
  <div class="t2">= 你刷手机？</div>
  <div class="t3">你点过的每一个赞，都在帮它<em>收窄</em>你的世界</div>
</div></div>
<script>window.FB_VIEW = { W: 1080, H: 1440, vertical: true, early: -Math.PI / 2, oy: 170, dim: [0, 0], tag: [0, 0], tagX: 0 };</script>
<script src="engine.js"></script>
<script type="module">
  import './light.js';
  import { drawWorld } from './world.js';
  const g = document.getElementById('cv').getContext('2d');
  LV.start({ duration: 1, width: 1080, height: 1440, scenes: [['root', 0, 1]], render: { root() { drawWorld(g, 38.5); } } });
</script>
</body>
</html>
