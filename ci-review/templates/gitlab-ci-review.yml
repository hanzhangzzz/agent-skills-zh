# ci-review：MR 每次 push 审执行；do/* 机器人分支额外审价值，双通过才可自动合入。
# 用法：在 .gitlab-ci.yml 里 `include: - local: .gitlab/ci-review.yml`。审查规范在 .gitlab/ci-review.md。
# CI/CD Variables：
#   ANTHROPIC_AUTH_TOKEN  网关或 Anthropic 的 API key（masked）；用订阅额度则改设 CLAUDE_CODE_OAUTH_TOKEN
#   ANTHROPIC_BASE_URL    Anthropic 兼容网关地址，如 https://open.bigmodel.cn/api/anthropic；不设 = 官方 Anthropic
#   ANTHROPIC_MODEL       网关上的模型名，如 glm-5.3；不设 = CLI 默认
#   GITLAB_TOKEN          项目访问令牌，api scope（masked）。仅审查：Reporter 以上；自动合并：Developer 以上
#                         （CI_JOB_TOKEN 不能发 MR 评论）
ci-review:
  stage: test
  image: node:22
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
    # 合并档位（/ci-review merge on|off 改这里）：
    #   "false" = 仅审查；"true" = 审查通过即合并，仅限 CI_REVIEW_MERGE_BRANCHES 匹配的来源分支
    CI_REVIEW_MERGE: "false"
    CI_REVIEW_MERGE_BRANCHES: "do/*"   # 空格分隔的 glob，默认只合 do-something 的分支
    CI_REVIEW_MERGE_METHOD: "squash"   # squash | merge
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq curl git > /dev/null
    - curl -fsSL https://claude.ai/install.sh | bash
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - |
      claude -p "REPO: $CI_PROJECT_PATH
      PROJECT_ID: $CI_PROJECT_ID
      MR: $CI_MERGE_REQUEST_IID
      HEAD_SHA: $CI_COMMIT_SHA
      HEAD_REF: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      BASE_SHA: $CI_MERGE_REQUEST_DIFF_BASE_SHA
      START_SHA: $CI_MERGE_REQUEST_DIFF_BASE_SHA
      BASE_REF: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      VALUE_REVIEW_BRANCHES: $CI_REVIEW_MERGE_BRANCHES
      读取仓库里的 .gitlab/ci-review.md，严格按它执行。" \
        --allowedTools "Bash,Read,Grep,Glob" \
        --output-format json
    # 先把失败 verdict 变成红 job；合并仍由确定性脚本决定。
    - |
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID"; H="PRIVATE-TOKEN: $GITLAB_TOKEN"
      curl -sf -H "$H" "$API/notes?per_page=100" \
        | jq -r '[.[] | select(.body | startswith("<!-- ci-review last="))] | last | .body // ""' \
        > /tmp/ci-review-sticky.md
      bash .gitlab/ci-review-verdict.sh check "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "$CI_COMMIT_SHA" \
        /tmp/ci-review-sticky.md "$CI_REVIEW_MERGE_BRANCHES"
    - |
      [ "$CI_REVIEW_MERGE" = "true" ] || exit 0
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID"; H="PRIVATE-TOKEN: $GITLAB_TOKEN"
      unresolved="$(curl -sf -H "$H" "$API/discussions?per_page=100" | jq '[.[] | select(.notes[0].resolvable==true and .notes[0].resolved==false)] | length')"
      if output="$(bash .gitlab/ci-review-verdict.sh merge "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "$CI_COMMIT_SHA" \
          /tmp/ci-review-sticky.md "$CI_REVIEW_MERGE_BRANCHES" "$unresolved")"; then
        echo "$output"
      else
        rc=$?; echo "$output"
        [ "$rc" = 3 ] && exit 0
        exit "$rc"
      fi
      title="$(curl -sf -H "$H" "$API" | jq -r .title)"
      ready="$(sed -E 's/^(([[(]?(Draft|WIP)[])]?[-:]?) *)+//I' <<<"$title")"   # Draft: / [Draft] / (Draft) / Draft- / WIP:
      [ "$title" = "$ready" ] || curl -sf -H "$H" -X PUT "$API" --data-urlencode "title=$ready" >/dev/null
      squash=false; [ "$CI_REVIEW_MERGE_METHOD" = "squash" ] && squash=true
      # 本 job 还在跑，pipeline 未结束；merge_when_pipeline_succeeds 让 GitLab 在 pipeline 成功后合并
      curl -sf -H "$H" -X PUT "$API/merge" -d "squash=$squash" -d "should_remove_source_branch=true" -d "merge_when_pipeline_succeeds=true" >/dev/null
      echo "已提交合并 MR !${CI_MERGE_REQUEST_IID}（${CI_COMMIT_SHA}），pipeline 成功后生效"
