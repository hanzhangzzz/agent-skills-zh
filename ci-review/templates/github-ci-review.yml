# ci-review：每次 push 到 PR 时审执行；do/* 机器人分支额外审价值，双通过才可自动合入。
# 安装：/ci-review（或 scripts/install.sh）。审查规范在 .github/ci-review.md，按仓库口味改它。
# 模型接入（不占 Claude 订阅额度）：
#   Secret   CI_REVIEW_API_KEY   网关或 Anthropic 的 API key（必填）
#   Variable CI_REVIEW_BASE_URL  Anthropic 兼容网关地址，如 https://open.bigmodel.cn/api/anthropic、
#                                https://api.minimaxi.com/anthropic、https://api.deepseek.com/anthropic；留空 = 官方 Anthropic
#   Variable CI_REVIEW_MODEL     网关上的模型名，如 glm-5.3、MiniMax-M3；留空 = CLI 默认模型
# 想用 Pro/Max 订阅额度：删掉 anthropic_api_key 行，改 claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
name: ci-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
concurrency:
  group: ci-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  # 合并档位（/ci-review merge on|off 改这里）：
  #   "false" = 仅审查；"true" = 审查通过即合并，仅限 CI_REVIEW_MERGE_BRANCHES 匹配的来源分支
  CI_REVIEW_MERGE: "false"
  CI_REVIEW_MERGE_BRANCHES: "do/*"   # 空格分隔的 glob，默认只合 do-something 的分支
  CI_REVIEW_MERGE_METHOD: "squash"   # squash | merge | rebase，须是仓库允许的方式
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 合并需要；仅审查模式可降为 read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ vars.CI_REVIEW_BASE_URL }}
          # 多数网关要 Bearer 头；action 不透传 ANTHROPIC_AUTH_TOKEN，用自定义头补上
          ANTHROPIC_CUSTOM_HEADERS: "${{ vars.CI_REVIEW_BASE_URL != '' && format('Authorization: Bearer {0}', secrets.CI_REVIEW_API_KEY) || '' }}"
        with:
          # 用仓库自带 token，评论以 github-actions[bot] 身份发，免装 Claude GitHub App；
          # 想以 Claude 身份发评论就删掉这行并安装 https://github.com/apps/claude
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.CI_REVIEW_API_KEY }}
          # 评论分类会额外调一次 Haiku，网关上多半没有，关掉；本审查规范自己传 confirmed:true
          classify_inline_comments: false
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            HEAD_REF: ${{ github.event.pull_request.head.ref }}
            BASE_REF: ${{ github.event.pull_request.base.ref }}
            VALUE_REVIEW_BRANCHES: ${{ env.CI_REVIEW_MERGE_BRANCHES }}
            读取仓库里的 .github/ci-review.md，严格按它执行。
          claude_args: |
            --allowedTools "Bash,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            ${{ vars.CI_REVIEW_MODEL != '' && format('--model {0}', vars.CI_REVIEW_MODEL) || '' }}
      # 模型只写 verdict；脚本先把失败变成红 check，再单独判断是否满足自动合入条件。
      - name: validate review verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- ci-review last="))] | last | .body // ""' \
            > /tmp/ci-review-sticky.md
          bash .github/scripts/ci-review-verdict.sh check "$HEAD_REF" "$HEAD_SHA" \
            /tmp/ci-review-sticky.md "$CI_REVIEW_MERGE_BRANCHES"
      - name: merge when both verdicts pass
        if: env.CI_REVIEW_MERGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          unresolved="$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100){nodes{isResolved}}}}}' \
            -f o="${REPO%/*}" -f r="${REPO#*/}" -F n="$PR" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved==false)] | length')"
          if output="$(bash .github/scripts/ci-review-verdict.sh merge "$HEAD_REF" "$HEAD_SHA" \
              /tmp/ci-review-sticky.md "$CI_REVIEW_MERGE_BRANCHES" "$unresolved")"; then
            echo "$output"
          else
            rc=$?; echo "$output"
            [ "$rc" = 3 ] && exit 0
            exit "$rc"
          fi
          # GITHUB_TOKEN 触发的 ready_for_review 不会再起一次 workflow；换成 PAT 就会，这一关防第二次运行重复合并
          [ "$(gh pr view "$PR" --json state --jq .state)" = OPEN ] || { echo "跳过：PR 已不是 OPEN"; exit 0; }
          gh pr ready "$PR" 2>/dev/null || true
          # 分支保护把本 workflow 设为必需检查时，此刻检查尚未完成，直接合并会被拒；退回 --auto（需仓库开启 allow auto-merge）
          gh pr merge "$PR" "--$CI_REVIEW_MERGE_METHOD" --delete-branch \
            || gh pr merge "$PR" --auto "--$CI_REVIEW_MERGE_METHOD" --delete-branch
          echo "已合并 PR #${PR}（${HEAD_SHA}）"
