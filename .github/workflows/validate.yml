name: validate

# 全仓行为门禁：所有本地可复现测试共用 .github/scripts/run_behavior_tests.sh。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pyyaml requests
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bash .github/scripts/run_behavior_tests.sh
